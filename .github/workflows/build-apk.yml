name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --force
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace 2>&1 | tee ../build.log
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::$(grep -E 'FAILURE:' -A 15 ../build.log || tail -n 25 ../build.log)"
            exit 1
          fi

      - name: Prepare APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./cute-beep.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cute-beep-app
          path: ./cute-beep.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "Cute Beep APK v1.0.2"
          body: "The cute kids toy beep app APK! Download cute-beep.apk directly and install on both Android phones."
          files: ./cute-beep.apk
